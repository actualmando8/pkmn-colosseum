name: Build

on:
  push:
  pull_request:

# The chart commit on master needs write access. An explicit block replaces the
# default scopes wholesale, so packages: read must be restated here or the
# private build container can no longer be pulled.
permissions:
  contents: write
  packages: read

jobs:
  build:
    # This is a *private* build container.
    # See docs/github_actions.md for more information.
    container: ghcr.io/dougchansan/pkmn-colosseum-build:main

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Add game versions here
        version: [GC6E01]

    steps:
    # Checkout the repository
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    # Set Git config
    - name: Git config
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    # Normalize file mod times
    - name: Restore timestamps
      run: |
        uv run https://raw.githubusercontent.com/MestreLion/git-tools/refs/tags/v2022.12/git-restore-mtime \
            --merge --commit-time

    # Copy the original files to the workspace
    - name: Prepare
      run: cp -a /orig .

    # Restore cached files
    - name: Cache build
      uses: actions/cache@v4
      with:
        path: |
          build
          .ninja_deps
          .ninja_log
        key: ${{ runner.os }}-${{ matrix.version }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ matrix.version }}-

    # Build the project
    - name: Build
      run: |
        python configure.py --map --version ${{ matrix.version }} \
            --binutils /binutils --compilers /compilers
        ninja all_source progress build/${{ matrix.version }}/report.json

    # Upload map files
    - name: Upload map
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_maps
        path: build/${{ matrix.version }}/**/*.MAP

    # Upload progress report
    - name: Upload report
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.version }}_report
        path: build/${{ matrix.version }}/report.json

    # Render the progress chart from the report this run just built. Every point
    # on the chart is a real objdiff measurement, never a hand-entered number.
    #
    # The chart and its series live on the unprotected `progress-chart` branch,
    # not on master: master requires status checks, so a push from inside a
    # check is rejected (GH006) and would turn every master build red.
    - name: Render progress chart
      if: matrix.version == 'GC6E01'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
        rm -rf /tmp/chart
        if ! git clone --quiet --depth 1 --branch progress-chart "$REMOTE" /tmp/chart; then
          echo "progress-chart branch missing; starting it"
          git clone --quiet --depth 1 "$REMOTE" /tmp/chart
          git -C /tmp/chart checkout --quiet --orphan progress-chart
          git -C /tmp/chart rm -rq --cached .
          find /tmp/chart -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
        fi
        # Writes nothing when the metrics are unchanged, so an ordinary no-op
        # push produces no commit and cannot fill the branch with duplicate PNGs.
        uv run --with matplotlib tools/plot_progress.py \
            --append build/${{ matrix.version }}/report.json \
            --history /tmp/chart/progress_history.json \
            --write-history -o /tmp/chart/progress.png

    # On a PR the chart is a preview artifact only: it is not committed, and a
    # fork PR has no write token anyway.
    - name: Upload chart preview
      if: github.event_name == 'pull_request' && matrix.version == 'GC6E01'
      uses: actions/upload-artifact@v4
      with:
        name: progress_chart_preview
        path: /tmp/chart/progress.png
        if-no-files-found: ignore

    # On master the measured point is published so the README image stays
    # current. The branch carries only the chart and its series, so master's
    # history stays free of regenerated binaries.
    - name: Publish progress chart
      if: >-
        github.event_name == 'push'
        && github.ref == 'refs/heads/master'
        && matrix.version == 'GC6E01'
      run: |
        cd /tmp/chart
        git add progress.png progress_history.json
        if git diff --cached --quiet; then
          echo "progress unchanged; nothing to publish"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit --quiet -m "Update progress chart for ${GITHUB_SHA}"
        git push --quiet origin progress-chart
