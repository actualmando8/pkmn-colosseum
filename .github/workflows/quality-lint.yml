name: Quality Lint
# Blocks match-cheating patterns in newly added source: asm-wrappers and .inc
# includes embed raw target asm instead of real C. Scans only the PR's added lines.
on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Git config
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Scan added lines for asm-wrappers / .inc includes
        run: |
          python3 .github/scripts/quality_scan.py '${{ github.event.pull_request.base.sha }}' '${{ github.sha }}'
