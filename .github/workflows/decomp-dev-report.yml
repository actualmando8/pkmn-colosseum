# Publishes the decomp.dev progress report. decomp.dev scans completed *push*
# runs on the DEFAULT branch (master) for an artifact named "<VERSION>_report"
# (here GC6E01_report) containing an objdiff-format report.json, then ingests it
# (see https://decomp.dev/manage/new). No API key is needed.
#
# We cannot regenerate the report in public CI: it needs the ROM-extracted target
# objects, which CI can't legally hold. So we upload the committed snapshot
# report.json. Regenerate it locally when progress changes and commit the result:
#     python tools/gen_decomp_report.py -o report.json
# (Fully-automatic regeneration later needs a private build container with the
# original files baked in -- see the notes in progress.yml.)
name: decomp.dev report

on:
  push:
    branches: [master]

jobs:
  upload-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload report.json as the GC6E01_report artifact
        if: ${{ hashFiles('report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: GC6E01_report
          path: report.json
