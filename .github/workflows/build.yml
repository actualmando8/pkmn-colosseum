name: Configure Check

# The full byte-match build (`ninja`) requires orig/GC6E01 (your own ROM), which
# is not — and can't be — on the public repo. So CI validates that the dtk-template
# build configuration is well-formed (configure.py generates build.ninja +
# objdiff.json); the byte-match itself is verified locally where the ROM lives.

on:
  push:
    branches: [master]
    paths:
      - 'configure.py'
      - 'tools/**'
      - 'config/**'
  pull_request:
    branches: [master]
    paths:
      - 'configure.py'
      - 'tools/**'
      - 'config/**'

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate build configuration
        run: python configure.py

      - name: Lint build tooling
        run: |
          python -m pip install --quiet flake8
          flake8 configure.py tools/project.py tools/split_dol.py tools/refined_to_splits.py || true
