# Progress report for every push to master / PR. Generates an objdiff-format
# report.json and uploads it as the artifact `GC6E01_report` — which is exactly
# what decomp.dev ingests (it pulls the artifact after the run; no API key
# needed).
#
# To go live on decomp.dev:
#   1. Make sure this workflow runs on `master` and uploads `GC6E01_report`
#      (it needs the ROM-extracted target objects + compiler — see below).
#   2. As a repo admin, register the repo at https://decomp.dev/manage/new
#   3. (Optional) Install the decomp.dev GitHub App on the repo for instant
#      updates + automatic PR comments instead of 5-minute polling.
#   4. Add the badge to README: ![Progress](https://decomp.dev/<user>/<repo>.svg)
#
# The match% step needs the original ROM's target objects, which public CI
# cannot legally hold. Like other decomp.dev projects, bake the orig files into
# a PRIVATE build container (see Dockerfile + docker/README.md) and switch the
# `container:` line below to it. Until then only the compile check runs and the
# report step is skipped gracefully.

name: Progress

on:
  push:
    branches: [master]
  pull_request:

jobs:
  progress:
    runs-on: ubuntu-latest
    # When the build container is published, uncomment:
    # container: ghcr.io/<owner>/pkmn-colosseum-build:main

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Without the published container, we install deps inline. Slower but
      # works on a vanilla runner. Swap for the container once it's pushed.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              python3 ninja-build unzip curl ca-certificates
          # mwcc bundle
          curl -sL -o /tmp/compilers.zip \
              https://files.decomp.dev/compilers_20251118.zip
          mkdir -p tools/mwcc_compiler
          unzip -q /tmp/compilers.zip -d tools/mwcc_compiler
          # objdiff-cli (linux)
          curl -sL -o tools/objdiff-cli.exe \
              https://github.com/encounter/objdiff/releases/download/v3.6.1/objdiff-cli-linux-x86_64
          chmod +x tools/objdiff-cli.exe
          # wibo
          sudo curl -sL -o /usr/local/bin/wibo \
              https://github.com/decompals/wibo/releases/download/1.0.3/wibo
          sudo chmod +x /usr/local/bin/wibo

      # We need the target .o (auto_01_800055E0_text.o) extracted from the
      # original ROM. CI without the ROM can only check that .c files
      # *compile*; the match% step needs the ROM. Skip gracefully if absent.
      - name: Compile all source
        run: |
          python3 tools/compile_check.py --all || echo "compile_check.py --all not implemented; skipping"

      # decomp.dev ingests the objdiff report format. objdiff-cli reads the
      # tracked objdiff.json plus the built target/base objects and emits it.
      - name: Generate progress report (objdiff format)
        if: ${{ hashFiles('build/GC6E01/obj/auto_01_800055E0_text.o') != '' }}
        run: |
          mkdir -p build/GC6E01
          ./tools/objdiff-cli.exe report generate -o build/GC6E01/report.json
          echo "::group::Summary"
          python3 tools/progress.py --no-files || true
          echo "::endgroup::"

      # decomp.dev pulls this artifact (named <VERSION>_report) after the run —
      # no API key. Register at https://decomp.dev/manage/new.
      - name: Upload report
        if: ${{ hashFiles('build/GC6E01/report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: GC6E01_report
          path: build/GC6E01/report.json
