name: Build Check

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'config/**'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'config/**'

jobs:
  compile-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile all source files
        run: python tools/compile_check.py --all
        shell: bash

      - name: Report results
        if: always()
        run: |
          echo "## Compile Results" >> $GITHUB_STEP_SUMMARY
          python tools/compile_check.py --all 2>&1 | tail -5 >> $GITHUB_STEP_SUMMARY
        shell: bash
